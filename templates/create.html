{% extends "base.html" %}

{% block title %}Crear Usuario{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="d-flex align-items-center mb-4">
            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary rounded-circle me-3" style="width:40px; height:40px; display:flex; align-items:center; justify-content:center;">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h2 class="fw-bold mb-0">Registrar Nuevo Usuario</h2>
        </div>
        
        <div class="card glass-card shadow-sm border-0 rounded-4">
            <div class="card-body p-5">
                <form method="POST" action="{{ url_for('create') }}">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label for="nombre" class="form-label fw-medium">Nombre Completo</label>
                            <input type="text" class="form-control custom-input" id="nombre" name="nombre" required placeholder="Ej. Juan Pérez">
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label fw-medium">Correo Electrónico</label>
                            <input type="email" class="form-control custom-input" id="email" name="email" required placeholder="ejemplo@correo.com">
                        </div>
                        <div class="col-12">
                            <label for="rol" class="form-label fw-medium">Rol del Usuario</label>
                            <select class="form-select custom-input" id="rol" name="rol" required>
                                <option value="" selected disabled>Seleccione un rol...</option>
                                <option value="usuario">Usuario Estándar</option>
                                <option value="admin">Administrador</option>
                            </select>
                        </div>
                    </div>
                    
                    <hr class="my-4 text-muted">
                    
                    <div class="d-flex justify-content-end">
                        <a href="{{ url_for('index') }}" class="btn btn-light px-4 py-2 me-2 fw-medium rounded-3">Cancelar</a>
                        <button type="submit" class="btn btn-primary custom-btn px-4 py-2 fw-bold rounded-3">
                            <i class="fa-solid fa-save me-2"></i>Guardar Usuario
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
