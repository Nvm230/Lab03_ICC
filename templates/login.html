{% extends "base.html" %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card glass-card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="icon-circle mb-3">
                        <i class="fa-solid fa-user-lock fa-2x text-primary"></i>
                    </div>
                    <h2 class="fw-bold">Bienvenido</h2>
                    <p class="text-muted">Inicia sesión en el panel de administración</p>
                </div>
                
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control custom-input" id="username" name="username" placeholder="Usuario" required>
                        <label for="username"><i class="fa-solid fa-user text-muted"></i> Usuario</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control custom-input" id="password" name="password" placeholder="Contraseña" required>
                        <label for="password"><i class="fa-solid fa-lock text-muted"></i> Contraseña</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-bold custom-btn">
                        Ingresar <i class="fa-solid fa-arrow-right ms-1"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
